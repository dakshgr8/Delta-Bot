# ==============================================================================
# Delta-Bot Production Nginx Reverse Proxy Configuration
# Hardened Reverse Proxy with SSL/TLS Termination, WebSocket Stream & Rate Limiting
# ==============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Suppress Nginx version disclosure

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Configuration
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/deltabot_access.log main_ext;
    error_log /var/log/nginx/deltabot_error.log warn;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # -------------------------------------------------------------------------
    # Upstream Backend Pool (Delta-Bot FastAPI Daemon)
    # -------------------------------------------------------------------------
    upstream deltabot_upstream {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Rate Limiting Zones (DDoS & Brute-Force Prevention)
    # -------------------------------------------------------------------------
    # General API / Static Rate Limit: 30 requests/second per IP
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # Strict Control & Config Mutation Limit: 5 requests/second per IP
    limit_req_zone $binary_remote_addr zone=control_limit:10m rate=5r/s;

    # -------------------------------------------------------------------------
    # HTTP to HTTPS Redirection (Port 80 -> 443)
    # -------------------------------------------------------------------------
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ACME challenge for Let's Encrypt / Certbot renewal
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Redirect all other HTTP traffic to HTTPS permanently
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS Production Gateway (Port 443)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name deltabot.internal.yourdomain.com; # Update with your domain

        # SSL/TLS Certificate Paths
        ssl_certificate /etc/letsencrypt/live/deltabot/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deltabot/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/deltabot/chain.pem;

        # Hardened SSL/TLS Protocol & Cipher Suite (Mozilla Modern / Intermediate)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

        # SSL Session Parameters
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        # Security Headers (OWASP Recommended)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss:; img-src 'self' data:;" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Buffer & Payload Limitations
        client_max_body_size 2M;
        client_body_buffer_size 128k;

        # ---------------------------------------------------------------------
        # Location: Strict Rate-Limited Control Endpoints
        # ---------------------------------------------------------------------
        location ~ ^/api/(control/|config|positions/.*/close) {
            limit_req zone=control_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://deltabot_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        # ---------------------------------------------------------------------
        # Location: WebSocket Real-Time Stream (/ws/live)
        # ---------------------------------------------------------------------
        location /ws/ {
            proxy_pass http://deltabot_upstream;
            proxy_http_version 1.1;

            # WebSocket Protocol Upgrade Handshake
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Persistent Streaming Connection (disable buffering & idle timeout)
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 10s;
        }

        # ---------------------------------------------------------------------
        # Location: Standard API Endpoints & Dashboard SPA
        # ---------------------------------------------------------------------
        location / {
            limit_req zone=general_limit burst=40 nodelay;
            limit_req_status 429;

            proxy_pass http://deltabot_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
