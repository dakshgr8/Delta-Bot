services:
  - type: web
    name: delta-bot-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_bot.py --web --host 0.0.0.0 --port $PORT --mode paper
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EXECUTION_MODE
        value: paper
      - key: WEB_ENABLED
        value: "true"
      - key: DASHBOARD_AUTH_TOKEN
        generateValue: true
      - key: DELTA_API_KEY
        sync: false
      - key: DELTA_API_SECRET
        sync: false
      - key: DELTA_BASE_URL
        value: https://api.delta.exchange
      - key: DELTA_WS_URL
        value: wss://socket.delta.exchange
